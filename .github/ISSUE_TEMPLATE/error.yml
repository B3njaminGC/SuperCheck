name: Reportar un error
description: Algo no funciona como debería
labels: ["error"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Contanos qué estabas haciendo y qué viste en la pantalla. Si podés, sumá una captura.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: input
    id: telefono
    attributes:
      label: Modelo de celular y versión de Android
      placeholder: Samsung A54, Android 14
  - type: input
    id: version
    attributes:
      label: Versión de la app (etiqueta de la release)
      placeholder: app-13
