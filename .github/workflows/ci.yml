# Verifica el proyecto con el SDK real de Flutter en cada push y pull request.
# No hace falta generar las carpetas android/ e ios/: analyze y test solo usan
# pubspec.yaml, lib/ y test/.
#
# Si un paso falla, además de fallar publica su salida completa como anotación
# del job (se ve arriba en la página de la ejecución, sin abrir los logs).
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(head -c 60000 analyze.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter analyze falló::$msg"
          fi
          exit "$code"

      # Corre aunque el análisis haya fallado, para ver todos los problemas juntos.
      - name: Tests
        if: always()
        run: |
          set +e
          flutter test 2>&1 | tee test.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 60000 test.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter test falló::$msg"
          fi
          exit "$code"
