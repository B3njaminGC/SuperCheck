# Verifica el proyecto con el SDK real de Flutter en cada push y pull request.
# No hace falta generar las carpetas android/ e ios/: analyze y test solo usan
# pubspec.yaml, lib/ y test/.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test
