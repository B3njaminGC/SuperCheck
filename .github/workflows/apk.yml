# Construye el APK de Android y lo publica como "Release" del repositorio.
#
# Se ejecuta a mano (pestaña Actions -> "APK de Android" -> Run workflow) o al subir un
# tag que empiece con "v". El archivo queda en la pestaña Releases como SuperCheck.apk.
name: APK de Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Misma llave de firma en todas las construcciones: así cada APK nuevo se instala
      # encima del anterior sin perder las listas guardadas en el teléfono.
      - name: Llave de firma estable
        run: |
          mkdir -p ~/.android ~/.gradle/init.d
          cp android-signing/debug.keystore ~/.android/debug.keystore
          cp tools/signing.init.gradle ~/.gradle/init.d/signing.gradle
          echo "SUPERCHECK_KEYSTORE=$GITHUB_WORKSPACE/android-signing/debug.keystore" >> "$GITHUB_ENV"

      - name: Carpeta android/
        run: |
          flutter create --platforms=android --org com.supercheck --project-name supercheck .
          # `flutter create` puede añadir un test de ejemplo que no corresponde a esta app.
          rm -f test/widget_test.dart
          python3 tools/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
          python3 tools/patch_android_gradle.py android/app

      - name: Dependencias
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Construir APK
        run: |
          set +e
          flutter build apk --release --no-shrink --build-number=${{ github.run_number }} \
            $( [ -n "${SUPABASE_URL}" ] && echo "--dart-define=SUPABASE_URL=${SUPABASE_URL}" ) \
            $( [ -n "${SUPABASE_ANON_KEY}" ] && echo "--dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" ) \
            2>&1 | tee build.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 60000 build.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter build apk falló::$msg"
          fi
          exit "$code"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Si la firma no es la llave fija, el APK no se publica: no se podría actualizar encima.
      # Con el código ofuscado la cámara no arranca: si vuelve a pasar, no se publica.
      - name: Comprobar que el código no esté ofuscado
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/check.apk
          if ! unzip -p /tmp/check.apk 'classes*.dex' | strings -n 6 | grep -q "dev/steenbakker/mobile_scanner/MobileScanner"; then
            echo "::error title=Código ofuscado::las clases del escáner aparecen renombradas (R8 sigue activo)"
            exit 1
          fi
          echo "Código sin ofuscar: ok"

      - name: Comprobar la firma
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SuperCheck.apk
          expected=$(keytool -list -keystore android-signing/debug.keystore -storepass android \
            | grep -i "SHA-256" | sed 's/.*: //' | tr -d ':' | tr 'a-f' 'A-F')
          tool=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          actual=$("$tool" verify --print-certs SuperCheck.apk | grep -i "SHA-256 digest" | head -1 \
            | sed 's/.*: //' | tr 'a-f' 'A-F')
          echo "esperada: $expected"
          echo "obtenida: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error title=Firma incorrecta::esperada $expected, obtenida $actual"
            exit 1
          fi
          echo "::notice title=Huella de la firma::$actual"
          ls -l SuperCheck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SuperCheck-apk
          path: SuperCheck.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="app-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$tag" SuperCheck.apk \
            --target "${GITHUB_SHA}" \
            --title "SuperCheck (versión ${GITHUB_RUN_NUMBER})" \
            --notes "APK para instalar en Android. Descargá SuperCheck.apk desde acá abajo."
