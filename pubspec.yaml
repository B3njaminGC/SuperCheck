name: supercheck
description: SuperCheck - lista de supermercado inteligente, compartida y con verificador de códigos de barras.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Backend (auth + base de datos + realtime)
  supabase_flutter: ^2.15.4 # desde 2.15 existe `publishableKey` (anonKey quedó obsoleto)

  # Red / Open Food Facts
  http: ^1.2.2

  # Escáner de códigos de barras
  mobile_scanner: ^6.0.2

  # Almacenamiento en el teléfono: guarda las listas del modo "sin cuenta" y
  # recuerda qué modo se estaba usando
  shared_preferences: ^2.3.0

  # Fotos de productos propios: sacar una foto o elegirla de la galería
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Enviar una copia de la lista por WhatsApp u otra app (menú de compartir de Android)
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0

  # Utilidades
  equatable: ^2.0.5
  intl: ^0.19.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Genera los íconos de Android a partir de assets/icon/ (se corre al armar el APK)
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
