name: supercheck
description: SuperCheck - lista de supermercado inteligente, compartida y con verificador de códigos de barras.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Backend (auth + base de datos + realtime)
  supabase_flutter: ^2.15.4 # desde 2.15 existe `publishableKey` (anonKey quedó obsoleto)

  # Red / Open Food Facts
  http: ^1.2.2

  # Escáner de códigos de barras
  mobile_scanner: ^6.0.2

  # Almacenamiento en el teléfono: guarda las listas del modo "sin cuenta" y
  # recuerda qué modo se estaba usando
  shared_preferences: ^2.3.0

  # Utilidades
  equatable: ^2.0.5
  intl: ^0.19.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
